services:
  - type: web
    name: iit-student-management
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: SECRET_KEY
        generateValue: true
      - key: DATA_FILE
        value: /var/data/records.json
    disk:
      name: student-management-data
      mountPath: /var/data
      sizeGB: 1
