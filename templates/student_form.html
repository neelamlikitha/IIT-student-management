{% extends "base.html" %}
{% block title %}Edit student{% endblock %}
{% block breadcrumb %}<a href="{{ url_for('students') }}">Students</a> / Edit{% endblock %}
{% block content %}
  <div class="page-heading"><div><p class="eyebrow">STUDENT PROFILE</p><h1>Edit student</h1><p class="page-description">Update the academic details for {{ student.name }}.</p></div><a class="button button-secondary" href="{{ url_for('students') }}"><svg class="inline-arrow arrow-back" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m6 6-6-6 6-6"/></svg>Back to students</a></div>
  <section class="panel form-panel">
    <form class="form-grid" method="post">
      <label>Student ID<input value="{{ student.student_id }}" readonly></label>
      <label>Full name<input name="name" maxlength="100" value="{{ student.name }}" required></label>
      <label>Grade<input name="grade" maxlength="30" value="{{ student.grade }}" required></label>
      <div class="form-actions"><button class="button button-primary" type="submit">Save changes</button></div>
    </form>
  </section>
{% endblock %}
